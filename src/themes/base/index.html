<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="tepuy-theme" content="base@1.0.0">
  <meta name="tepuy-version" content="2.0">
  <title>Tepuy: tema Base - Plantilla de presentación</title>
</head>
<body data-autoload="false" data-display-window="modal" data-window-width="100%" data-window-height="100%">
  <div id="body">
    <div id="content">
      <h1 class="metadata" data-key="title"></h1>
      <h3 class="metadata" data-key="topic"></h3>
      <section class="metadata" data-key="description"></section>
      <h2>Objetivo</h2>
      <section class="metadata" data-key="objective"></section>
      <h2>Detalles</h2>
      <ul>
        <li><strong>Duración:</strong> <span class="metadata" data-key="duration" data-unit="hours"></span></li>
        <li><strong>Participación:</strong> <span class="metadata" data-key="participation"></span></li>
        <li><strong>Modalidad:</strong> <span class="metadata" data-key="modality"></span></li>
        <li><strong>Sincronía:</strong> <span class="metadata" data-key="synchronicity"></span></li>
      </ul>
      <div id="play_scorm"></div>
    </div>
  </div>
</body>
</html>
